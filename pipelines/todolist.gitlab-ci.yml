# Secure CI/CD pipeline — ToDo List (Java / Spring Boot / Maven)
#
# Copy into the root of the todolist repository as .gitlab-ci.yml.
# Stages and job names follow the pipeline documented in the ITSecurity repo
# (docs/technical-documentation.md, fig. 8.1). See pipelines/README.md for the
# CI/CD variables it needs.

stages:
  - build
  - test
  - sast
  - package
  - sca-package
  - publish
  - sca-container
  - deploy
  - fuzz
  - dast
  - report

variables:
  APP_NAME: Todolist
  MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE: $CI_REGISTRY_IMAGE/todolist
  CONTAINER_NAME: todolist
  APP_PORT: "8080"
  APP_URL: "http://$SSH_IP:$APP_PORT"
  DASHBOARD_URL: "http://10.97.13.101:3001"

.maven:
  image: $MAVEN_IMAGE
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository

.docker:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# ── build ──────────────────────────────────────────────────────────────

todolist_build:
  extends: .maven
  stage: build
  script:
    - mvn -B compile

# ── test ───────────────────────────────────────────────────────────────

todolist_unit_test:
  extends: .maven
  stage: test
  script:
    - mvn -B test -Dtest='!*IT,!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml

todolist_integration_test:
  extends: .maven
  stage: test
  needs:
    - todolist_unit_test
  script:
    - mvn -B test -Dtest='*IT,*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml

# ── sast ───────────────────────────────────────────────────────────────

todolist_gitleaks_sast:
  stage: sast
  needs: []
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --report-format json --report-path gitleaks-report.json --exit-code 0
  artifacts:
    when: always
    paths:
      - gitleaks-report.json

todolist_semgrep_sast:
  stage: sast
  needs: []
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config p/java --config p/owasp-top-ten
        --json-output=semgrep-report.json
        --gitlab-sast-output=gl-sast-report.json
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    reports:
      sast: gl-sast-report.json

# ── package ────────────────────────────────────────────────────────────

todolist_package:
  extends: .maven
  stage: package
  script:
    - mvn -B package -DskipTests
  artifacts:
    paths:
      - target/*.jar

# ── sca-package ────────────────────────────────────────────────────────

# The NVD API answering 503 broke this job once (acceptance.md, defect 1).
# An NVD API key, a cached database and retries keep that from failing the run.
todolist_sca_package:
  extends: .maven
  stage: sca-package
  cache:
    - key: maven-$CI_COMMIT_REF_SLUG
      paths:
        - .m2/repository
    - key: dependency-check-data
      paths:
        - .dependency-check-data
  retry:
    max: 2
    when: script_failure
  script:
    - mvn -B org.owasp:dependency-check-maven:12.1.0:check
        -Dformats=JSON,HTML
        -DdataDirectory=$CI_PROJECT_DIR/.dependency-check-data
        -DnvdApiKey=$NVD_API_KEY
        -DfailBuildOnCVSS=11
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.json
      - target/dependency-check-report.html

# ── publish ────────────────────────────────────────────────────────────

todolist_publish_container:
  extends: .docker
  stage: publish
  needs:
    - todolist_package
  script:
    - docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE:latest

todolist_publish_package:
  stage: publish
  image: curlimages/curl:latest
  needs:
    - todolist_package
  script:
    - |
      for jar in target/*.jar; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$jar" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/todolist/$CI_COMMIT_SHORT_SHA/$(basename "$jar")"
      done

# ── sca-container ──────────────────────────────────────────────────────

todolist_sca_container:
  stage: sca-container
  needs:
    - todolist_publish_container
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_CACHE_DIR: .trivycache/
  cache:
    key: trivy
    paths:
      - .trivycache/
  script:
    - trivy image --exit-code 0 --format json --output trivy-report.json $IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $IMAGE:$CI_COMMIT_SHORT_SHA
  artifacts:
    when: always
    paths:
      - trivy-report.json

# ── deploy ─────────────────────────────────────────────────────────────

todolist_deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - todolist_integration_test
    - todolist_semgrep_sast
    - todolist_gitleaks_sast
    - todolist_sca_package
    - todolist_sca_container
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config
  script:
    - |
      ssh $SSH_USER@$SSH_IP << EOF
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker pull $IMAGE:$CI_COMMIT_SHORT_SHA
        docker stop $CONTAINER_NAME || true
        docker rm   $CONTAINER_NAME || true
        docker run -d --name $CONTAINER_NAME -p $APP_PORT:8080 --restart unless-stopped $IMAGE:$CI_COMMIT_SHORT_SHA
        docker ps --filter name=$CONTAINER_NAME
      EOF
  environment:
    name: production
    url: $APP_URL

# ── fuzz ───────────────────────────────────────────────────────────────

# JavaFuzz needs a fuzz target class in the project (FUZZ_TARGET_CLASS).
# Exit code 124 means the time limit ran out without a crash, which counts as a pass.
todolist_fuzz:
  extends: .maven
  stage: fuzz
  needs:
    - todolist_build
  variables:
    FUZZ_SECONDS: "300"
  script:
    - timeout $FUZZ_SECONDS mvn -B javafuzz:fuzz -DclassName=$FUZZ_TARGET_CLASS || [ $? -eq 124 ]
  artifacts:
    when: on_failure
    paths:
      - crash-*

# ── dast ───────────────────────────────────────────────────────────────

todolist_dast:
  stage: dast
  needs:
    - todolist_deploy
  image: ghcr.io/zaproxy/zaproxy:stable
  script:
    - mkdir -p /zap/wrk
    - zap-baseline.py -t $APP_URL -J zap-report.json -r zap-report.html -I
    - cp /zap/wrk/zap-report.* .
  artifacts:
    when: always
    paths:
      - zap-report.json
      - zap-report.html

# ── report ─────────────────────────────────────────────────────────────

# Converts each scanner's report to the dashboard's ingest format and POSTs it.
# A missing report is skipped, so the dashboard keeps that tool's last results.
todolist_report_dashboard:
  stage: report
  image: alpine:latest
  when: always
  needs:
    - { job: todolist_gitleaks_sast, artifacts: true, optional: true }
    - { job: todolist_semgrep_sast,  artifacts: true, optional: true }
    - { job: todolist_sca_package,   artifacts: true, optional: true }
    - { job: todolist_sca_container, artifacts: true, optional: true }
    - { job: todolist_dast,          artifacts: true, optional: true }
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      post() {
        tool=$1; file=$2; filter=$3
        if [ ! -s "$file" ]; then echo "skip $tool: no $file"; return; fi
        jq "$filter" "$file" \
          | jq --arg app "$APP_NAME" --arg tool "$tool" --arg run "pipeline-$CI_PIPELINE_ID" \
              '{app: $app, tool: $tool, run_id: $run, vulnerabilities: .}' \
          | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$DASHBOARD_URL/vulnerabilities" \
          || echo "warn: posting $tool to dashboard failed"
        echo
      }

      post Gitleaks gitleaks-report.json \
        '[.[] | {severity: "HIGH", title: .RuleID, description: .Description, file_path: "\(.File):\(.StartLine)"}]'

      post Semgrep semgrep-report.json \
        '[.results[] | {severity: ({ERROR: "HIGH", WARNING: "MEDIUM"}[.extra.severity] // "LOW"),
          title: .check_id, description: .extra.message, file_path: "\(.path):\(.start.line)"}]'

      post OWASP-DepCheck target/dependency-check-report.json \
        '[.dependencies[]? | .fileName as $f | .vulnerabilities[]? |
          {severity: (.severity | ascii_upcase | if . == "MODERATE" then "MEDIUM" else . end),
           title: .name, description: (.description // "")[0:500], file_path: $f}]'

      post Trivy trivy-report.json \
        '[.Results[]? | .Target as $t | .Vulnerabilities[]? |
          {severity: .Severity, title: .VulnerabilityID,
           description: "\(.PkgName) \(.InstalledVersion): \(.Title // "")", file_path: $t}]'

      post OWASP-ZAP zap-report.json \
        '[.site[]?.alerts[]? |
          {severity: (.riskdesc | split(" ")[0] | ascii_upcase | if . == "INFORMATIONAL" then "LOW" else . end),
           title: .name, description: (.desc | gsub("<[^>]*>"; ""))[0:500], file_path: (.instances[0].uri // "")}]'
