# Secure CI/CD pipeline — OWASP Juice Shop (Node.js)
#
# Copy into the root of the JuiceShop repository as .gitlab-ci.yml.
# Stages and job names follow the pipeline documented in the ITSecurity repo
# (docs/technical-documentation.md, fig. 8.1). See pipelines/README.md for the
# CI/CD variables it needs.

stages:
  - package
  - sast
  - sca-package
  - publish
  - sca-container
  - deploy
  - fuzzing
  - dast
  - report

variables:
  APP_NAME: JuiceShop
  NODE_IMAGE: node:20
  IMAGE: $CI_REGISTRY_IMAGE/juice-shop
  CONTAINER_NAME: juice-shop
  APP_PORT: "3000"
  APP_URL: "http://$SSH_IP:$APP_PORT"
  DASHBOARD_URL: "http://10.97.13.101:3001"

.node:
  image: $NODE_IMAGE
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm/
  before_script:
    - npm config set cache $CI_PROJECT_DIR/.npm --global

.docker:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# ── package ────────────────────────────────────────────────────────────

# Juice Shop's postinstall also builds the Angular frontend.
JuiceShop_package:
  extends: .node
  stage: package
  script:
    - npm install --no-audit --no-fund
    - npm pack
  artifacts:
    paths:
      - juice-shop-*.tgz

# ── sast ───────────────────────────────────────────────────────────────

JuiceShop_gitleaks-report:
  stage: sast
  needs: []
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --report-format json --report-path gitleaks-report.json --exit-code 0
  artifacts:
    when: always
    paths:
      - gitleaks-report.json

JuiceShop_semgrep-sast:
  stage: sast
  needs: []
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config p/javascript --config p/typescript --config p/nodejs --config p/owasp-top-ten
        --json-output=semgrep-report.json
        --gitlab-sast-output=gl-sast-report.json
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    reports:
      sast: gl-sast-report.json

# ── sca-package ────────────────────────────────────────────────────────

JuiceShop_sca_package:
  extends: .node
  stage: sca-package
  needs: []
  script:
    - npm install --package-lock-only --ignore-scripts --no-audit --no-fund
    - npm audit --json > npm-audit-report.json || true
    - npm audit --audit-level=high || true
  artifacts:
    when: always
    paths:
      - npm-audit-report.json

# ── publish ────────────────────────────────────────────────────────────

JuiceShop_publish_container:
  extends: .docker
  stage: publish
  needs:
    - JuiceShop_package
  script:
    - docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE:latest

# ── sca-container ──────────────────────────────────────────────────────

JuiceShop_sca_container:
  stage: sca-container
  needs:
    - JuiceShop_publish_container
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_CACHE_DIR: .trivycache/
  cache:
    key: trivy
    paths:
      - .trivycache/
  script:
    - trivy image --exit-code 0 --format json --output trivy-report.json $IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $IMAGE:$CI_COMMIT_SHORT_SHA
  artifacts:
    when: always
    paths:
      - trivy-report.json

# ── deploy ─────────────────────────────────────────────────────────────

JuiceShop_auto_deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - JuiceShop_semgrep-sast
    - JuiceShop_gitleaks-report
    - JuiceShop_sca_package
    - JuiceShop_sca_container
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config
  script:
    - |
      ssh $SSH_USER@$SSH_IP << EOF
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker pull $IMAGE:$CI_COMMIT_SHORT_SHA
        docker stop $CONTAINER_NAME || true
        docker rm   $CONTAINER_NAME || true
        docker run -d --name $CONTAINER_NAME -p $APP_PORT:3000 --restart unless-stopped $IMAGE:$CI_COMMIT_SHORT_SHA
        docker ps --filter name=$CONTAINER_NAME
      EOF
  environment:
    name: production
    url: $APP_URL

# Waits for the deployed app to answer before fuzzing and DAST run against it.
JuiceShop_deploy_check:
  stage: deploy
  image: curlimages/curl:latest
  needs:
    - JuiceShop_auto_deploy
  script:
    - |
      for i in $(seq 1 30); do
        if curl -fsS -o /dev/null "$APP_URL"; then echo "Juice Shop is up at $APP_URL"; exit 0; fi
        sleep 5
      done
      echo "Juice Shop did not come up at $APP_URL" >&2
      exit 1

# ── fuzzing ────────────────────────────────────────────────────────────

# jsfuzz needs a fuzz target module in the repository (FUZZ_TARGET).
# Exit code 124 means the time limit ran out without a crash, which counts as a pass.
JuiceShop_fuzzing:
  extends: .node
  stage: fuzzing
  needs:
    - JuiceShop_package
  variables:
    FUZZ_SECONDS: "300"
  script:
    - npm install --no-save jsfuzz
    - timeout $FUZZ_SECONDS npx jsfuzz $FUZZ_TARGET fuzz-corpus || [ $? -eq 124 ]
  artifacts:
    when: on_failure
    paths:
      - crash-*

# ── dast ───────────────────────────────────────────────────────────────

JuiceShop_dast:
  stage: dast
  needs:
    - JuiceShop_deploy_check
  image: ghcr.io/zaproxy/zaproxy:stable
  script:
    - mkdir -p /zap/wrk
    - zap-baseline.py -t $APP_URL -J zap-report.json -r zap-report.html -I
    - cp /zap/wrk/zap-report.* .
  artifacts:
    when: always
    paths:
      - zap-report.json
      - zap-report.html

# ── report ─────────────────────────────────────────────────────────────

# Converts each scanner's report to the dashboard's ingest format and POSTs it.
# A missing report is skipped, so the dashboard keeps that tool's last results.
JuiceShop_report_dashboard:
  stage: report
  image: alpine:latest
  when: always
  needs:
    - { job: JuiceShop_gitleaks-report, artifacts: true, optional: true }
    - { job: JuiceShop_semgrep-sast,    artifacts: true, optional: true }
    - { job: JuiceShop_sca_package,     artifacts: true, optional: true }
    - { job: JuiceShop_sca_container,   artifacts: true, optional: true }
    - { job: JuiceShop_dast,            artifacts: true, optional: true }
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      post() {
        tool=$1; file=$2; filter=$3
        if [ ! -s "$file" ]; then echo "skip $tool: no $file"; return; fi
        jq "$filter" "$file" \
          | jq --arg app "$APP_NAME" --arg tool "$tool" --arg run "pipeline-$CI_PIPELINE_ID" \
              '{app: $app, tool: $tool, run_id: $run, vulnerabilities: .}' \
          | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$DASHBOARD_URL/vulnerabilities" \
          || echo "warn: posting $tool to dashboard failed"
        echo
      }

      post Gitleaks gitleaks-report.json \
        '[.[] | {severity: "HIGH", title: .RuleID, description: .Description, file_path: "\(.File):\(.StartLine)"}]'

      post Semgrep semgrep-report.json \
        '[.results[] | {severity: ({ERROR: "HIGH", WARNING: "MEDIUM"}[.extra.severity] // "LOW"),
          title: .check_id, description: .extra.message, file_path: "\(.path):\(.start.line)"}]'

      post npm-audit npm-audit-report.json \
        '[.vulnerabilities // {} | to_entries[] |
          {severity: (.value.severity | ascii_upcase | if . == "MODERATE" then "MEDIUM" elif . == "INFO" then "LOW" else . end),
           title: .key,
           description: ([.value.via[] | objects | "\(.title) \(.url // "")"] | join("; ")),
           file_path: "package.json"}]'

      post Trivy trivy-report.json \
        '[.Results[]? | .Target as $t | .Vulnerabilities[]? |
          {severity: .Severity, title: .VulnerabilityID,
           description: "\(.PkgName) \(.InstalledVersion): \(.Title // "")", file_path: $t}]'

      post OWASP-ZAP zap-report.json \
        '[.site[]?.alerts[]? |
          {severity: (.riskdesc | split(" ")[0] | ascii_upcase | if . == "INFORMATIONAL" then "LOW" else . end),
           title: .name, description: (.desc | gsub("<[^>]*>"; ""))[0:500], file_path: (.instances[0].uri // "")}]'
