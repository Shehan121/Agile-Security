stages:
  - publish
  - deploy

publish_backend:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE/backend:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG ./backend
    - docker push $IMAGE_TAG

publish_frontend:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE/frontend:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG ./frontend
    - docker push $IMAGE_TAG

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - publish_backend
    - publish_frontend
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config
  script:
    - |
      ssh $SSH_USER@$SSH_IP << EOF
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker pull $CI_REGISTRY_IMAGE/backend:latest
        docker pull $CI_REGISTRY_IMAGE/frontend:latest
        docker stop vuln-backend  || true
        docker stop vuln-frontend || true
        docker rm   vuln-backend  || true
        docker rm   vuln-frontend || true
        docker network create vuln-network || true
        docker run -d --name vuln-backend  --network vuln-network -p 3001:3001 -v vuln-data:/data --restart unless-stopped $CI_REGISTRY_IMAGE/backend:latest
        docker run -d --name vuln-frontend --network vuln-network -p 3002:80   --restart unless-stopped $CI_REGISTRY_IMAGE/frontend:latest
        docker ps
      EOF