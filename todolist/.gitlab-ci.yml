stages:
  - build
  - test
  - sast
  - package
  - sca-package
  - sca-container
  - publish
  - deploy
  - dast

# include:
#   - template: Jobs/Secret-Detection.gitlab-ci.yml

cache:
  policy: pull-push
  paths:
    - .m2/repository
    - todolist/.dependency-check

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

# Shared Maven setup
.default_maven:
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - cd todolist


todolist_build:
  stage: build
  extends: .default_maven

  script:
    - mvn clean compile

  artifacts:
    expire_in: 1 hour
    paths:
      - todolist/target/


todolist_unit_test:
  stage: test
  extends: .default_maven

  script:
    - mvn test -Dtest=*UnitTests -Dsurefire.failIfNoSpecifiedTests=false

  artifacts:
    when: always
    paths:
      - todolist/target/surefire-reports/
    reports:
      junit:
        - todolist/target/surefire-reports/*.xml

todolist_integration_test:
  stage: test
  extends: .default_maven

  script:
    - mvn test -Dtest=*IntegrationTests -Dsurefire.failIfNoSpecifiedTests=false

  artifacts:
    when: always
    paths:
      - todolist/target/surefire-reports/
    reports:
      junit:
        - todolist/target/surefire-reports/*.xml

todolist_semgrep_sast:
  stage: sast

  image: returntocorp/semgrep:latest

  script:
    - cd todolist
    - mkdir -p target/surefire-reports

    - |
      semgrep scan \
        --config=auto \
        --gitlab-sast \
        --output=target/surefire-reports/gl-sast-report.json . || true

  artifacts:
    when: always

    paths:
      - todolist/target/surefire-reports/gl-sast-report.json

    reports:
      sast:
        - todolist/target/surefire-reports/gl-sast-report.json

  allow_failure: true


todolist_gitleaks_sast:
  stage: sast

  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  script:
    - cd todolist
    - mkdir -p target/surefire-reports

    - |
      gitleaks detect \
        --source . \
        --report-path target/surefire-reports/gitleaks-report.json \
        --report-format json || true

  artifacts:
    when: always

    paths:
      - todolist/target/surefire-reports/gitleaks-report.json

  allow_failure: true

todolist_package:
  stage: package
  extends: .default_maven

  script:
    - mvn clean package -DskipTests
    - ls -lah target/

  artifacts:
    expire_in: 1 hour
    paths:
      - todolist/target/*.jar



todolist_sca_package:
  stage: sca-package
  extends: .default_maven

  script:
    - |
      mvn org.owasp:dependency-check-maven:check \
      -DfailBuildOnCVSS=11 \
      -Dformats=HTML,JSON \
      -DnvdApiKey=$NVD_API_KEY \
      -DdataDirectory=.dependency-check

  allow_failure: true

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - todolist/target/dependency-check-report.html
      - todolist/target/dependency-check-report.json


todolist_publish_package:
  stage: publish
  extends: .default_maven

  dependencies:
    - todolist_package

  script:
    - |
      mkdir -p /root/.m2

      cat > /root/.m2/settings.xml << EOF
      <settings>
        <servers>
          <server>
            <id>gitlab</id>
            <configuration>
              <httpHeaders>
                <property>
                  <name>Job-Token</name>
                  <value>${CI_JOB_TOKEN}</value>
                </property>
              </httpHeaders>
            </configuration>
          </server>
        </servers>
      </settings>
      EOF

    - |
      mvn deploy -DskipTests \
      -DaltDeploymentRepository=gitlab::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven


todolist_publish_container:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind

  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/todolist:$CI_COMMIT_SHORT_SHA
    DOCKER_TLS_CERTDIR: "/certs"

  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $IMAGE_TAG ./todolist
    - docker push $IMAGE_TAG

  allow_failure: true

todolist_sca_container:
  stage: sca-container

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - mkdir -p todolist/report
    - trivy fs --format json -o todolist/report/trivy-report.json todolist
    - trivy fs todolist > todolist/report/trivy-report.txt

  artifacts:
    when: always

    paths:
      - todolist/report/trivy-report.json
      - todolist/report/trivy-report.txt

  allow_failure: true

todolist_auto_deploy:
  stage: deploy

  image: alpine:latest

  needs:
    - todolist_publish_container

  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $SSH_IP >> ~/.ssh/known_hosts

  script:
    - |
      ssh $SSH_USER@$SSH_IP << EOF | tee deploy.log
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
      docker pull $CI_REGISTRY_IMAGE/todolist:$CI_COMMIT_SHORT_SHA

      docker stop todolist || true
      docker rm todolist || true

      docker run -d \
        --name todolist \
        -p 8080:8080 \
        --restart unless-stopped \
        $CI_REGISTRY_IMAGE/todolist:$CI_COMMIT_SHORT_SHA

      docker ps

      EOF

  artifacts:
    when: always
    paths:
      - deploy.log

  allow_failure: true

todolist_dast-zap:
  stage: dast

  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]

  variables:
    ZAP_TARGET: "http://$SSH_IP:8080"

  needs:
    - job: todolist_auto_deploy

  script:
    - mkdir -p /zap/wrk todolist/report
    - zap-baseline.py -t $ZAP_TARGET -J zap-report.json -r zap-report.html -l WARN || true
    - cp /zap/wrk/zap-report.* todolist/report/

  artifacts:
    when: always
    paths:
      - todolist/report/zap-report.json
      - todolist/report/zap-report.html

  allow_failure: true
